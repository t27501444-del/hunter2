<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HUNTER2</title>
</head>
<body>
<script>
    const basePath = "/hunter2/";
    const path = location.pathname;

    // 기본 경로를 제외한 나머지 추출
    const value = path.startsWith(basePath)
        ? path.substring(basePath.length).replace(/\/$/, "")
        : "";

   // 유효성 검사
    const isValid =
        location.search === "" &&
        location.hash === "" &&
        value.length > 0 &&
        !value.includes("/") &&
        !value.includes("\\");

    if (isValid) {
        fetch(`${basePath}main.html`)
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();

                // 추출한 값 사용
                window.downloadValue = value;
            });
  } else {
      // 기본 404 페이지 표시
      document.body.innerHTML = `
        <h2>404 - 페이지를 찾을 수 없습니다.</h2>
        <p>요청하신 주소가 올바르지 않습니다.</p>
      `;
  }
</script>
</body>
</html>
