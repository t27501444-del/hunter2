<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="HUNTER2 모바일 앱 설치 및 담당자 코드">
  <title>HUNTER2 | 앱 설치</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --surface: #1b1d22;
      --surface-soft: #22242a;
      --line: rgba(255,255,255,.09);
      --red: #d83b45;
      --red-light: #ff6a70;
      --text: #f5f3f2;
      --muted: #aaa7a6;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
    }
    body {
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Noto Sans KR",
        "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% -12%, rgba(198, 42, 51, .20), transparent 43%),
        radial-gradient(ellipse at 100% 55%, rgba(120, 28, 34, .10), transparent 34%),
        linear-gradient(180deg, #141519 0%, #101114 62%, #0c0d10 100%);
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100svh;
    }

    .page {
      width: min(100%, 480px);
      min-height: 100svh;
      margin: 0 auto;
      padding: var(--safe-top) 0 calc(var(--safe-bottom) + 22px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
    }

    .topbar {
      min-height: 42px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.055);
      color: #c9c4c2;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .signal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #d2c8c6;
    }
    .signal i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7bc69a;
      box-shadow: 0 0 10px rgba(123,198,154,.45);
    }
    .version {
      color: #aaa2a0;
      letter-spacing: .08em;
    }

    .hero {
      width: 100%;
      padding: 0 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .logo {
      display: block;
      width: min(82%, 330px);
      max-width: 100%;
      height: auto;
      max-height: 38svh;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 12px 26px rgba(0,0,0,.38));
    }
    .logo-fallback {
      display: none;
      width: 190px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      color: #fff;
      background: radial-gradient(circle at 50% 45%, #bd3039, #501a20 70%, #17181c 71%);
      font-size: 25px;
      font-weight: 950;
      letter-spacing: .08em;
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
    }

    .content {
      width: 100%;
      padding: 0 22px;
      display: grid;
      gap: 13px;
    }
    .intro {
      display: grid;
      gap: 5px;
      padding: 0 2px 2px;
    }
    .eyebrow {
      color: var(--red-light);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .16em;
    }
    .intro h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(21px, 5.6vw, 25px);
      line-height: 1.25;
      font-weight: 900;
      letter-spacing: -.045em;
    }
    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .code-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(39,40,46,.96), rgba(27,28,33,.96));
      box-shadow: 0 12px 28px rgba(0,0,0,.20), inset 0 1px rgba(255,255,255,.035);
    }
    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 850;
    }
    .card-title small {
      color: var(--red-light);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .08em;
    }
    .status {
      flex: 0 0 auto;
      padding: 5px 9px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      color: #c9c2c0;
      background: rgba(0,0,0,.18);
      font-size: 10px;
      font-weight: 750;
    }
    .code-row {
      margin-top: 13px;
      padding: 11px 11px 11px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 11px;
      background: rgba(9,10,12,.42);
    }
    .code-value {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 18px;
      font-weight: 850;
      letter-spacing: .07em;
    }
    .copy-btn {
      flex: 0 0 auto;
      min-height: 37px;
      padding: 0 13px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      color: #f8eeee;
      background: #393238;
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
      transition: transform .15s, filter .15s;
    }
    .copy-btn:active, .download-btn:active {
      transform: scale(.98);
      filter: brightness(1.12);
    }

    .download-btn {
      width: 100%;
      min-height: 58px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      border: 1px solid rgba(255,150,154,.45);
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(100deg, #c9323e, #e34a50);
      box-shadow: 0 8px 20px rgba(177,39,49,.24), inset 0 1px rgba(255,255,255,.20);
      font-size: 16px;
      font-weight: 950;
      letter-spacing: .04em;
      cursor: pointer;
      transition: transform .15s, filter .15s;
    }
    .download-btn svg { width: 21px; height: 21px; flex: 0 0 auto; }
    .download-sub {
      display: block;
      margin-top: 2px;
      color: rgba(255,255,255,.78);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .hint {
      margin: -3px 2px 0;
      color: #aaa4a3;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }
    .install-guide {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(27,29,34,.82);
      box-shadow: 0 8px 22px rgba(0,0,0,.12);
    }
    .guide-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .guide-title {
      font-size: 13px;
      font-weight: 900;
    }
    .guide-title small {
      margin-right: 7px;
      color: var(--red-light);
      font-size: 10px;
      letter-spacing: .08em;
    }
    .guide-note {
      color: #918b8a;
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .guide-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .guide-step {
      min-width: 0;
      padding: 10px 8px;
      border: 1px solid rgba(255,255,255,.065);
      border-radius: 10px;
      background: rgba(0,0,0,.15);
    }
    .step-number {
      width: 22px;
      height: 22px;
      margin-bottom: 8px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #ffdfe0;
      background: rgba(216,59,69,.20);
      font-size: 9px;
      font-weight: 950;
    }
    .step-title {
      color: #f1edec;
      font-size: 11px;
      font-weight: 850;
      line-height: 1.35;
      word-break: keep-all;
    }
    .step-copy {
      margin-top: 5px;
      color: #9e9897;
      font-size: 9px;
      line-height: 1.45;
      word-break: keep-all;
    }

    .screen-message {
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
    }
    .message-inner { max-width: 360px; }
    .message-mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,106,112,.38);
      border-radius: 18px;
      color: var(--red-light);
      background: rgba(216,59,69,.12);
      font-size: 25px;
      font-weight: 900;
    }
    .error-code {
      color: var(--red-light);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .2em;
    }
    .message-inner h2 { margin: 12px 0 8px; font-size: 23px; }
    .message-inner p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

    @media (max-height: 700px) {
      .page { gap: 11px; padding-bottom: calc(var(--safe-bottom) + 14px); }
      .topbar { min-height: 34px; }
      .logo { max-height: 27svh; width: min(70%, 260px); }
      .content { gap: 9px; }
      .intro { gap: 3px; }
      .intro h1 { font-size: 20px; }
      .code-card { padding: 12px; }
      .code-row { margin-top: 9px; padding-top: 8px; padding-bottom: 8px; }
      .download-btn { min-height: 49px; }
      .install-guide { padding: 11px; }
      .guide-heading { margin-bottom: 8px; }
      .guide-step { padding: 7px 6px; }
      .step-number { width: 19px; height: 19px; margin-bottom: 5px; }
      .step-copy { display: none; }
    }

    @media (max-width: 360px) {
      .page { gap: 12px; }
      .topbar { padding-left: 16px; padding-right: 16px; font-size: 9px; }
      .hero { padding-left: 12px; padding-right: 12px; }
      .logo { width: min(78%, 270px); }
      .content { padding-left: 16px; padding-right: 16px; gap: 10px; }
      .code-card { padding: 13px 11px; }
      .code-value { font-size: 15px; }
      .status { padding: 5px 7px; font-size: 9px; }
      .guide-steps { gap: 5px; }
      .guide-step { padding: 8px 5px; }
      .step-title { font-size: 10px; }
      .step-copy { font-size: 8px; }
    }

    @media (max-height: 570px) {
      .page { gap: 7px; }
      .logo { max-height: 21svh; }
      .intro p, .step-copy { display: none; }
      .install-guide { padding-top: 8px; padding-bottom: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const CONFIG = {
      basePath: "/hunter2/",
      logoImageUrl: "/hunter2/images/logo-web.png",
      apkDownloadUrl: "https://github.com/t27501444-del/hunter2/releases/download/2/hunter2.apk",
      versionCode: "2",
      versionName: "2.0"
    };

    const app = document.getElementById("app");

    function isMobileDevice() {
      const ua = navigator.userAgent || "";
      const isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) || isIPadOS;
    }

    function getManagerCode() {
      const pathname = window.location.pathname;
      if (!pathname.startsWith(CONFIG.basePath)) return null;
      const segment = pathname.slice(CONFIG.basePath.length).replace(/\/$/, "");
      if (!segment || segment.includes("/") || segment.includes("\\")) return null;
      if (window.location.search !== "" || window.location.hash !== "") return null;
      try {
        const decoded = decodeURIComponent(segment);
        return decoded && !decoded.includes("/") && !decoded.includes("\\") ? decoded : null;
      } catch (_) { return null; }
    }

    function showMessage(code, title, description) {
      app.innerHTML = `<section class="screen-message"><div class="message-inner"><div class="message-mark" aria-hidden="true">!</div><div class="error-code">${code}</div><h2></h2><p></p></div></section>`;
      app.querySelector("h2").textContent = title;
      app.querySelector("p").textContent = description;
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {}
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      Object.assign(textarea.style, { position: "fixed", opacity: "0", pointerEvents: "none", left: "-9999px" });
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      let copied = false;
      try { copied = document.execCommand("copy"); } catch (_) { copied = false; }
      textarea.remove();
      return copied;
    }

    function setCopyStatus(success, manual = false) {
      const badge = document.getElementById("copyStatus");
      if (!badge) return;
      badge.textContent = success ? "클립보드 복사됨" : (manual ? "버튼 클릭 시 복사" : "자동 복사 대기중");
      badge.style.color = success ? "#a5e8bd" : "#ff9aa0";
      badge.style.borderColor = success ? "rgba(100,220,155,.35)" : "rgba(255,87,104,.34)";
    }

    function renderPage(managerCode) {
      app.innerHTML = `
        <div class="page">
          <div class="topbar">
            <span class="signal"><i></i>SECURE CONNECTION</span>
            <span class="version">HUNTER2&nbsp; ${CONFIG.versionName} (${CONFIG.versionCode})</span>
          </div>

          <header class="hero">
            <img class="logo" id="brandLogo" alt="HUNTER2 로고">
            <div class="logo-fallback" id="logoFallback">HUNTER2</div>
          </header>

          <section class="content" aria-label="앱 설치">
            <div class="intro">
              <div class="eyebrow">HUNTER2 MOBILE APP</div>
              <h1>앱 설치를 시작합니다</h1>
              <p>담당자 코드를 확인한 후 앱을 다운로드해 주세요.</p>
            </div>

            <article class="code-card">
              <div class="card-heading">
                <div class="card-title"><small>01</small>담당자 코드</div>
                <span class="status" id="copyStatus">자동 복사 대기중</span>
              </div>
              <div class="code-row">
                <div class="code-value" id="managerCode"></div>
                <button class="copy-btn" id="copyButton" type="button">복사</button>
              </div>
            </article>

            <button class="download-btn" id="downloadButton" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3v11m0 0 4.5-4.5M12 14 7.5 9.5M4 16.5v2A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>다운로드<span class="download-sub">HUNTER2 APK · 안전하게 설치하기</span></span>
            </button>

            <p class="hint">담당자 코드는 자동으로 복사됩니다. 설치가 차단되면 브라우저의 앱 설치 권한을 허용해 주세요.</p>

            <aside class="install-guide" aria-label="설치 안내">
              <div class="guide-heading">
                <div class="guide-title"><small>02</small>간단 설치 안내</div>
                <div class="guide-note">3 STEPS</div>
              </div>
              <div class="guide-steps">
                <div class="guide-step">
                  <div class="step-number">01</div>
                  <div class="step-title">코드 확인</div>
                  <div class="step-copy">담당자 코드를 확인합니다.</div>
                </div>
                <div class="guide-step">
                  <div class="step-number">02</div>
                  <div class="step-title">앱 다운로드</div>
                  <div class="step-copy">다운로드 버튼을 누릅니다.</div>
                </div>
                <div class="guide-step">
                  <div class="step-number">03</div>
                  <div class="step-title">설치 허용</div>
                  <div class="step-copy">안내에 따라 설치를 완료합니다.</div>
                </div>
              </div>
            </aside>
          </section>
        </div>`;

      const logo = document.getElementById("brandLogo");
      const fallback = document.getElementById("logoFallback");
      logo.src = CONFIG.logoImageUrl;
      logo.addEventListener("error", () => { logo.style.display = "none"; fallback.style.display = "grid"; });
      document.getElementById("managerCode").textContent = managerCode;

      document.getElementById("copyButton").addEventListener("click", async () => {
        const success = await copyToClipboard(managerCode);
        setCopyStatus(success, true);
      });

      document.getElementById("downloadButton").addEventListener("click", async () => {
        const success = await copyToClipboard(managerCode);
        setCopyStatus(success, true);
        const link = document.createElement("a");
        link.href = CONFIG.apkDownloadUrl;
        link.download = "hunter2.apk";
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      copyToClipboard(managerCode).then(success => setCopyStatus(success, false));
    }

    if (!isMobileDevice()) {
      showMessage("MOBILE ONLY", "모바일 전용 페이지입니다.", "HUNTER2 설치 페이지는 스마트폰 또는 태블릿에서 접속해 주세요.");
    } else {
      const managerCode = getManagerCode();
      if (managerCode === null) showMessage("404 ERROR", "404 - 페이지를 찾을 수 없습니다.", "담당자 코드가 포함된 올바른 설치 주소로 다시 접속해 주세요.");
      else renderPage(managerCode);
    }
  </script>
</body>
</html>
