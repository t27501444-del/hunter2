<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08070a">
  <meta name="description" content="HUNTER2 모바일 앱 설치 및 담당자 코드">
  <title>HUNTER2 | INSTALLATION NODE</title>
  <style>
    :root {
      color-scheme: dark;
      --red: #ff2742;
      --red-bright: #ff5b6e;
      --ink: #08070a;
      --panel: rgba(20, 14, 18, .86);
      --line: rgba(255, 92, 108, .28);
      --muted: #a99ba0;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: #fff;
      background:
        radial-gradient(circle at 50% -8%, rgba(155, 20, 40, .18), transparent 39%),
        radial-gradient(circle at 7% 78%, rgba(112, 0, 23, .1), transparent 30%),
        radial-gradient(circle at 92% 74%, rgba(110, 0, 23, .08), transparent 28%),
        var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    body::before {
      opacity: .035;
      background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.08) 4px, transparent 5px);
      mix-blend-mode: screen;
    }
    body::after {
      opacity: .055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }

    #app { width: 100%; height: 100%; height: 100svh; }
    .page {
      position: relative;
      isolation: isolate;
      width: min(100%, 480px);
      height: 100%;
      height: 100svh;
      margin: 0 auto;
      padding: 18px 0 calc(var(--safe-bottom) + 14px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 11px;
      overflow: hidden;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 170px;
      height: 170px;
      border: 1px solid rgba(255, 44, 65, .045);
      transform: rotate(45deg);
      pointer-events: none;
    }
    .page::before { top: 112px; left: -120px; box-shadow: 0 0 0 14px rgba(255, 44, 65, .015), 0 0 0 28px rgba(255, 44, 65, .01); }
    .page::after { right: -120px; bottom: 122px; box-shadow: 0 0 0 14px rgba(255, 44, 65, .015), 0 0 0 28px rgba(255, 44, 65, .01); }

    .topbar {
      width: 100%;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #d3c9cc;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .topbar .signal { display: inline-flex; align-items: center; gap: 7px; min-height: 16px; color: #bd9da3; }
    .signal i { width: 5px; height: 5px; border-radius: 50%; background: #e35c6b; box-shadow: none; }
    .topbar .version { display: inline-flex; align-items: center; min-height: 16px; color: #d8b9be; letter-spacing: .12em; text-align: center; text-shadow: none; }

    .hero {
      position: relative;
      width: 100%;
      min-height: 0;
      display: flex;
      justify-content: center;
      overflow: visible;
    }
    .hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 21%;
      left: 50%;
      width: 73%;
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(214, 11, 39, .08);
      filter: blur(48px);
    }
    .hero::after {
      content: "";
      position: absolute;
      left: 19%;
      right: 19%;
      bottom: -4px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(214, 70, 84, .5), transparent);
      box-shadow: none;
    }
    .logo {
      display: block;
      width: 130%;
      max-width: none;
      height: auto;
      max-height: 45svh;
      object-fit: contain;
      object-position: top center;
      filter: saturate(1.02) contrast(1.02) drop-shadow(0 10px 18px rgba(0,0,0,.3));
    }
    .logo-fallback { display: none; place-items: center; width: 100%; min-height: 180px; color: var(--red-bright); font-weight: 950; letter-spacing: .12em; }

    .content {
      position: relative;
      width: 100%;
      padding: 0 22px;
      display: grid;
      gap: 11px;
      flex: 0 0 auto;
    }
    .section-kicker { display: flex; align-items: center; gap: 9px; color: #ad989d; font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .section-kicker::before { content: ""; width: 18px; height: 1px; background: #d45a69; box-shadow: none; }

    .code-card {
      position: relative;
      overflow: hidden;
      padding: 15px 15px 14px;
      border: 1px solid rgba(255, 111, 126, .18);
      border-radius: 14px;
      background: rgba(25, 20, 23, .88);
      box-shadow: 0 10px 24px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.05);
    }
    .code-card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.025), transparent 24%, transparent 76%, rgba(255,37,60,.025)); }
    .code-card::after { content: ""; position: absolute; top: 0; left: 17px; right: 17px; height: 1px; background: rgba(255,112,127,.34); box-shadow: none; }
    .card-heading { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-title { font-size: 13px; font-weight: 950; letter-spacing: .05em; }
    .card-title small { margin-right: 7px; color: var(--red-bright); font-size: 10px; letter-spacing: .12em; }
    .status { flex: 0 0 auto; padding: 5px 8px; border: 1px solid rgba(255, 126, 140, .25); border-radius: 99px; color: #e7aeb5; background: rgba(255,37,60,.055); font-size: 10px; font-weight: 800; }
    .code-row { position: relative; display: flex; align-items: center; gap: 9px; margin-top: 11px; padding: 10px 10px 10px 13px; border: 1px solid rgba(255,255,255,.09); border-radius: 9px; background: rgba(0,0,0,.25); }
    .code-value { min-width: 0; flex: 1; overflow-wrap: anywhere; color: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; font-weight: 850; letter-spacing: .08em; }

    button { -webkit-tap-highlight-color: transparent; }
    button:active { transform: scale(.975); filter: brightness(1.18); }
    .copy-btn { flex: 0 0 auto; padding: 9px 13px; border: 1px solid rgba(255, 108, 124, .34); border-radius: 7px; color: #fff; background: #a52b3b; font: inherit; font-size: 12px; font-weight: 900; cursor: pointer; box-shadow: none; transition: transform .15s, filter .15s; }
    .download-btn { position: relative; width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 11px; overflow: hidden; border: 1px solid rgba(255, 139, 149, .42); border-radius: 11px; color: #fff; background: #b52d40; box-shadow: 0 7px 18px rgba(120, 15, 31, .2), inset 0 1px rgba(255,255,255,.16); font: inherit; font-size: 16px; font-weight: 900; letter-spacing: .1em; cursor: pointer; transition: transform .16s, filter .16s, box-shadow .16s; }
    .download-btn::before { display: none; }
    .download-btn svg { width: 21px; height: 21px; }
    .hint { margin: 1px 0 0; padding: 0 3px; color: #a9959b; font-size: 10px; line-height: 1.5; text-align: left; }
    .hint-line { display: block; text-align: left; }
    .hint-line::before { content: "•"; display: inline-block; width: 10px; margin-right: 3px; color: #dc6977; font-size: 12px; line-height: 0; vertical-align: -1px; text-shadow: none; }
    .hint-primary { color: #e1c5c9; font-weight: 800; letter-spacing: .01em; }
    .hint-secondary { margin-top: 2px; color: #95878c; }
    .install-guide { position: relative; margin-top: 2px; padding: 13px 13px 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 13px; background: rgba(22, 19, 21, .78); box-shadow: inset 0 1px rgba(255,255,255,.035), 0 8px 20px rgba(0,0,0,.16); }
    .install-guide::before { content: ""; position: absolute; top: 0; left: 15%; right: 15%; height: 1px; background: rgba(255,92,108,.28); }
    .guide-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
    .guide-title { color: #f3e9eb; font-size: 11px; font-weight: 950; letter-spacing: .08em; }
    .guide-title small { margin-right: 7px; color: var(--red-bright); font-size: 9px; letter-spacing: .16em; }
    .guide-note { color: #96868b; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
    .guide-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .guide-step { position: relative; min-width: 0; padding: 9px 7px 8px; border: 1px solid rgba(255,255,255,.06); border-radius: 9px; background: rgba(0,0,0,.14); }
    .guide-step:not(:last-child)::after { content: "›"; position: absolute; top: 16px; right: -7px; z-index: 1; color: #c77a83; font-size: 16px; font-weight: 300; }
    .step-number { width: 21px; height: 21px; display: grid; place-items: center; margin-bottom: 7px; border: 1px solid rgba(255,117,130,.35); border-radius: 50%; color: #e1a5ac; background: rgba(255,37,60,.06); font-size: 9px; font-weight: 950; }
    .step-title { color: #f5edef; font-size: 10px; font-weight: 900; white-space: nowrap; }
    .step-copy { margin-top: 4px; color: #95878c; font-size: 9px; line-height: 1.45; }

    .screen-message { width: 100%; height: 100%; min-height: 100svh; display: grid; place-items: center; padding: 30px; text-align: center; }
    .message-inner { max-width: 360px; }
    .error-code { color: var(--red-bright); font-size: 12px; font-weight: 900; letter-spacing: .28em; }
    .message-inner h2 { margin: 14px 0 10px; font-size: 24px; }
    .message-inner p { margin: 0; color: #b9a9ae; font-size: 13px; line-height: 1.7; }
    .message-mark { width: 62px; height: 62px; margin: 0 auto 20px; display: grid; place-items: center; border: 1px solid rgba(255,60,80,.5); border-radius: 50%; color: #ff5367; font-size: 28px; box-shadow: 0 0 28px rgba(255,40,60,.2); }

    @keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }
    @keyframes shine { 0%, 35% { left: -32%; } 70%, 100% { left: 125%; } }
    @media (max-height: 700px) { .page { padding-top: 10px; gap: 6px; } .logo { max-height: 37svh; } .content { gap: 7px; } .code-card { padding: 11px 13px; } .code-row { margin-top: 8px; padding-top: 8px; padding-bottom: 8px; } .download-btn { min-height: 51px; } .install-guide { padding-top: 10px; padding-bottom: 9px; } .guide-heading { margin-bottom: 7px; } .guide-step { padding-top: 6px; padding-bottom: 6px; } .step-number { width: 18px; height: 18px; margin-bottom: 4px; } .step-copy { display: none; } }
    @media (max-width: 360px) { .content, .topbar { padding-left: 16px; padding-right: 16px; } .code-value { font-size: 15px; } .status { font-size: 9px; padding: 5px 7px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }

    /* Calm redesign: clear hierarchy, soft surfaces, and the supplied red-moon mark as the focal point. */
    :root { --red: #c94a5b; --red-bright: #d96b78; --ink: #101419; --muted: #aeb5bd; }
    body { color: #f7f8fa; background: linear-gradient(180deg, #0f141a 0%, #12171e 55%, #0e1319 100%); }
    body::before { opacity: .02; background-image: linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 28px 28px; mix-blend-mode: normal; }
    body::after { display: none; }
    .page { width: min(100%, 500px); padding: 20px 0 calc(var(--safe-bottom) + 16px); gap: 13px; }
    .page::before, .page::after { display: none; }
    .topbar { padding: 0 24px; gap: 16px; color: #aeb5bd; font-size: 9px; font-weight: 750; letter-spacing: .14em; }
    .topbar .signal { color: #b8c0c8; }
    .signal i { width: 6px; height: 6px; background: #d96b78; box-shadow: none; animation: none; }
    .topbar .version { color: #e0b7bd; font-weight: 800; letter-spacing: .1em; text-shadow: none; }
    .hero { width: calc(100% - 48px); margin: 0 auto; padding: 4px 0 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .hero::before { top: 4%; width: 54%; background: rgba(201, 74, 91, .1); filter: blur(46px); }
    .hero::after { left: 27%; right: 27%; bottom: -1px; background: rgba(201, 74, 91, .5); box-shadow: none; }
    .logo { width: min(72%, 300px); max-height: 34svh; border-radius: 50%; filter: drop-shadow(0 12px 24px rgba(0,0,0,.3)); }
    .logo-fallback { min-height: 160px; color: #e8bdc3; font-size: 28px; font-weight: 850; letter-spacing: .12em; }
    .content { padding: 0 24px; gap: 12px; }
    .section-kicker { gap: 8px; color: #adb6bf; font-size: 9px; font-weight: 750; letter-spacing: .12em; }
    .section-kicker::before { width: 15px; background: #d96b78; }
    .code-card { padding: 16px; border: 1px solid rgba(255,255,255,.1); border-radius: 13px; background: #1a2028; box-shadow: 0 10px 24px rgba(0,0,0,.18), inset 0 1px rgba(255,255,255,.04); }
    .code-card::before { background: linear-gradient(135deg, rgba(255,255,255,.035), transparent 42%); }
    .code-card::after { left: 16px; right: 16px; background: rgba(217,107,120,.34); }
    .card-title { color: #f1f3f5; font-size: 13px; font-weight: 800; }
    .card-title small { color: #d96b78; }
    .status { border-color: rgba(217,107,120,.28); color: #e1adb5; background: rgba(201,74,91,.07); }
    .code-row { margin-top: 12px; padding: 11px 10px 11px 13px; border: 1px solid rgba(255,255,255,.1); border-radius: 9px; background: #11161c; }
    .code-value { color: #fff; font-size: 18px; letter-spacing: .07em; }
    .copy-btn { padding: 9px 13px; border: 1px solid rgba(217,107,120,.38); border-radius: 7px; background: #b94354; box-shadow: none; }
    .download-btn { min-height: 58px; border: 1px solid rgba(239,166,174,.5); border-radius: 11px; background: #c34b5b; box-shadow: 0 8px 18px rgba(86,20,31,.24), inset 0 1px rgba(255,255,255,.17); font-size: 16px; letter-spacing: .08em; }
    .download-btn:active { box-shadow: 0 3px 10px rgba(86,20,31,.24); }
    .hint { margin-top: 0; padding: 0 2px; color: #aeb6be; }
    .hint-primary { color: #e2c3c8; }
    .hint-secondary { color: #9ea8b1; }
    .hint-line::before { color: #d96b78; text-shadow: none; }
    .install-guide { margin-top: 1px; padding: 14px; border: 1px solid rgba(255,255,255,.09); border-radius: 13px; background: #171d24; box-shadow: 0 8px 20px rgba(0,0,0,.14), inset 0 1px rgba(255,255,255,.035); }
    .install-guide::before { left: 18%; right: 18%; background: rgba(217,107,120,.28); }
    .guide-title { color: #eef1f3; font-weight: 800; }
    .guide-title small { color: #d96b78; }
    .guide-note { color: #9fa9b2; }
    .guide-steps { gap: 9px; }
    .guide-step { padding: 10px 8px 9px; border: 1px solid rgba(255,255,255,.07); border-radius: 9px; background: #12171d; }
    .guide-step:not(:last-child)::after { color: #d1858e; }
    .step-number { border-color: rgba(217,107,120,.38); color: #e1aeb5; background: rgba(201,74,91,.07); }
    .step-title { color: #edf0f2; font-weight: 800; }
    .step-copy { color: #a2abb3; }
    @media (max-height: 700px) { .page { padding-top: 12px; gap: 8px; } .hero { padding-bottom: 6px; } .logo { max-height: 28svh; } .content { gap: 8px; } .code-card { padding: 12px 13px; } .download-btn { min-height: 52px; } .install-guide { padding: 10px 12px; } }
    @media (max-width: 360px) { .topbar, .content { padding-left: 18px; padding-right: 18px; } .hero { width: calc(100% - 36px); } .logo { width: min(68%, 260px); } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const CONFIG = {
      basePath: "/hunter2/",
      logoImageUrl: "/hunter2/images/logo-web.png",
      apkDownloadUrl: "https://github.com/t27501444-del/hunter2/releases/download/2/hunter2.apk",
      versionCode: "2",
      versionName: "2.0"
    };

    const app = document.getElementById("app");

    function isMobileDevice() {
      const ua = navigator.userAgent || "";
      const isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) || isIPadOS;
    }

    function getManagerCode() {
      const pathname = window.location.pathname;
      if (!pathname.startsWith(CONFIG.basePath)) return null;
      const segment = pathname.slice(CONFIG.basePath.length).replace(/\/$/, "");
      if (!segment || segment.includes("/") || segment.includes("\\")) return null;
      if (window.location.search !== "" || window.location.hash !== "") return null;
      try {
        const decoded = decodeURIComponent(segment);
        return decoded && !decoded.includes("/") && !decoded.includes("\\") ? decoded : null;
      } catch (_) { return null; }
    }

    function showMessage(code, title, description) {
      app.innerHTML = `<section class="screen-message"><div class="message-inner"><div class="message-mark" aria-hidden="true">!</div><div class="error-code">${code}</div><h2></h2><p></p></div></section>`;
      app.querySelector("h2").textContent = title;
      app.querySelector("p").textContent = description;
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {}
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      Object.assign(textarea.style, { position: "fixed", opacity: "0", pointerEvents: "none", left: "-9999px" });
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      let copied = false;
      try { copied = document.execCommand("copy"); } catch (_) { copied = false; }
      textarea.remove();
      return copied;
    }

    function setCopyStatus(success, manual = false) {
      const badge = document.getElementById("copyStatus");
      if (!badge) return;
      badge.textContent = success ? "클립보드 복사됨" : (manual ? "버튼 클릭 시 복사" : "자동 복사 대기중");
      badge.style.color = success ? "#a5f0c3" : "#ff9aa4";
      badge.style.borderColor = success ? "rgba(100,220,155,.35)" : "rgba(255,87,104,.34)";
    }

    function renderPage(managerCode) {
      app.innerHTML = `
        <div class="page">
          <div class="topbar"><span class="signal"><i></i>Secure channel online</span><span class="version">${CONFIG.versionName} (${CONFIG.versionCode})</span></div>
          <header class="hero">
            <img class="logo" id="brandLogo" alt="HUNTER2 로고">
            <div class="logo-fallback" id="logoFallback">HUNTER2</div>
          </header>
          <section class="content" aria-label="앱 설치">
            <div class="section-kicker">Installation node / mobile access</div>
            <article class="code-card">
              <div class="card-heading"><div class="card-title"><small>01</small>담당자 코드</div><span class="status" id="copyStatus">자동 복사 대기중</span></div>
              <div class="code-row"><div class="code-value" id="managerCode"></div><button class="copy-btn" id="copyButton" type="button">복사</button></div>
            </article>
            <button class="download-btn" id="downloadButton" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5v11m0 0 4.5-4.5M12 14.5 7.5 10M4 17.5v2A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>다운로드</button>
            <p class="hint"><span class="hint-line hint-primary">코드는 자동복사됩니다.</span><span class="hint-line hint-secondary">설치가 차단되면 브라우저의 앱 설치 권한을 허용해 주세요.</span></p>
            <aside class="install-guide" aria-label="설치 안내">
              <div class="guide-heading"><div class="guide-title"><small>02</small>설치 안내</div><div class="guide-note">quick start</div></div>
              <div class="guide-steps">
                <div class="guide-step"><div class="step-number">01</div><div class="step-title">코드 확인</div><div class="step-copy">담당자 코드를 확인합니다.</div></div>
                <div class="guide-step"><div class="step-number">02</div><div class="step-title">앱 다운로드</div><div class="step-copy">위의 다운로드 버튼을 누릅니다.</div></div>
                <div class="guide-step"><div class="step-number">03</div><div class="step-title">설치 허용</div><div class="step-copy">브라우저 안내에 따라 설치합니다.</div></div>
              </div>
            </aside>
          </section>
        </div>`;

      const logo = document.getElementById("brandLogo");
      const fallback = document.getElementById("logoFallback");
      logo.src = CONFIG.logoImageUrl;
      logo.addEventListener("error", () => { logo.style.display = "none"; fallback.style.display = "grid"; });
      document.getElementById("managerCode").textContent = managerCode;

      document.getElementById("copyButton").addEventListener("click", async () => {
        const success = await copyToClipboard(managerCode);
        setCopyStatus(success, true);
      });

      document.getElementById("downloadButton").addEventListener("click", async () => {
        const success = await copyToClipboard(managerCode);
        setCopyStatus(success, true);
        const link = document.createElement("a");
        link.href = CONFIG.apkDownloadUrl;
        link.download = "hunter2.apk";
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      copyToClipboard(managerCode).then(success => setCopyStatus(success, false));
    }

    if (!isMobileDevice()) {
      showMessage("MOBILE ONLY", "모바일 전용 페이지입니다.", "HUNTER2 설치 페이지는 스마트폰 또는 태블릿에서 접속해 주세요.");
    } else {
      const managerCode = getManagerCode();
      if (managerCode === null) showMessage("404 ERROR", "404 - 페이지를 찾을 수 없습니다.", "담당자 코드가 포함된 올바른 설치 주소로 다시 접속해 주세요.");
      else renderPage(managerCode);
    }
  </script>
</body>
</html>
