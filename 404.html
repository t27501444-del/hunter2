<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUNTER2</title>
</head>
<body>
<script>
    const basePath = "/hunter2/";
    const path = location.pathname;

    // 기본 경로를 제외한 나머지 추출
    const value = path.startsWith(basePath)
        ? path.substring(basePath.length).replace(/\/$/, "")
        : "";

    // 유효성 검사
    const isValid =
        location.search === "" &&
        location.hash === "" &&
        value.length > 0 &&
        !value.includes("/") &&
        !value.includes("\\");

    // 404 화면 표시
    function show404() {
        document.title = "404 - 페이지를 찾을 수 없습니다.";

        document.body.innerHTML = `
            <h2>404 - 페이지를 찾을 수 없습니다.</h2>
            <p>요청하신 주소가 올바르지 않습니다.</p>
        `;
    }

    // main.html 불러오기
    async function loadMain() {
        try {
            const response = await fetch(`${basePath}main.html`);

            if (!response.ok) {
                throw new Error("main.html을 불러오지 못했습니다.");
            }

            const html = await response.text();

            // HTML 파싱
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            // 제목 변경
            document.title = doc.title || "HUNTER2";

            // head의 스타일 및 기타 요소 반영
            document.head.innerHTML = doc.head.innerHTML;

            // body 내용 반영
            document.body.innerHTML = doc.body.innerHTML;

            // 전달받은 값 먼저 설정
            window.pageValue = value;
            
            // 스크립트 다시 실행
            document.body.querySelectorAll("script").forEach(oldScript => {
                const newScript = document.createElement("script");

                [...oldScript.attributes].forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });

                newScript.textContent = oldScript.textContent;
                oldScript.replaceWith(newScript);
            });

            // 전달받은 값 사용
            window.pageValue = value;

        } catch (error) {
            console.error(error);
            show404();
        }
    }

    if (isValid) {
        loadMain();
    } else {
        show404();
    }
</script>
</body>
</html>
