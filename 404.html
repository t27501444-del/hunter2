<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <meta name="description" content="HUNTER2 모바일 앱 설치 및 담당자 코드">
  <title>HUNTER2 | INSTALLATION NODE</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-base: #0d0f14;
      --bg-elevated: #151821;
      --bg-surface: rgba(24, 28, 38, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(229, 72, 77, 0.34);
      --accent: #e5484d;
      --accent-hover: #f2555a;
      --accent-soft: rgba(229, 72, 77, 0.12);
      --text-primary: #f3f4f6;
      --text-secondary: #a8b0bf;
      --text-muted: #768092;
      --success-text: #6ee7b7;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow-x: hidden;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      overflow-y: auto;
      background-image:
        radial-gradient(circle at 50% 6%, rgba(229, 72, 77, 0.11), transparent 44%),
        radial-gradient(circle at 15% 88%, rgba(59, 130, 246, 0.04), transparent 36%),
        linear-gradient(180deg, #0d0f14 0%, #0a0c10 100%);
    }

    #app {
      width: 100%;
      min-height: 100%;
      min-height: 100svh;
    }

    .page {
      width: min(100%, 460px);
      min-height: 100%;
      min-height: 100svh;
      margin: 0 auto;
      padding: 14px 18px calc(var(--safe-bottom) + 18px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .topbar .signal {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-primary);
    }

    .signal i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success-text);
      box-shadow: 0 0 8px rgba(110, 231, 183, 0.5);
    }

    .topbar .version {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px 0;
      flex-shrink: 0;
    }

    .hero-ring {
      position: relative;
      width: clamp(112px, 22svh, 156px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(145deg, rgba(229, 72, 77, 0.45), rgba(255, 255, 255, 0.06));
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45), 0 0 28px rgba(229, 72, 77, 0.12);
    }

    .logo {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #090a0d;
    }

    .logo-fallback {
      display: none;
      place-items: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #141720;
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .brand-caption {
      margin-top: 6px;
      text-align: center;
    }

    .brand-name {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--text-primary);
    }

    .section-kicker {
      margin-top: 2px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
    }

    .code-card {
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .card-title small {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-size: 10px;
      font-weight: 800;
    }

    .status {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-accent);
      background: var(--accent-soft);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 8px 8px 8px 12px;
      border-radius: 12px;
      background: rgba(10, 12, 16, 0.72);
      border: 1px solid var(--border-subtle);
    }

    .code-value {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-primary);
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    .copy-btn {
      flex-shrink: 0;
      padding: 8px 13px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #232836;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.14s ease;
    }

    .copy-btn:hover {
      background: #2c3244;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .download-btn {
      width: 100%;
      min-height: 50px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 130, 134, 0.35);
      background: linear-gradient(180deg, var(--accent-hover) 0%, var(--accent) 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(229, 72, 77, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: transform 0.15s ease, filter 0.18s ease, box-shadow 0.18s ease;
    }

    .download-btn:hover {
      filter: brightness(1.05);
    }

    .download-icon-badge {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
    }

    .download-btn svg {
      width: 15px;
      height: 15px;
    }

    .hint {
      margin: 0;
      padding: 0 4px;
      font-size: 11px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .hint-line {
      display: block;
    }

    .hint-primary {
      color: var(--text-secondary);
      font-weight: 600;
    }

    .hint-secondary {
      margin-top: 2px;
      color: var(--text-muted);
    }

    .install-guide {
      padding: 12px 13px;
      border-radius: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
    }

    .guide-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .guide-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .guide-title small {
      color: var(--accent-hover);
      font-size: 11px;
      font-weight: 800;
    }

    .guide-note {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .guide-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .guide-step {
      padding: 8px 6px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .step-number {
      width: 20px;
      height: 20px;
      margin: 0 auto 5px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      border: 1px solid var(--border-accent);
      color: #fca5a5;
      font-size: 10px;
      font-weight: 800;
    }

    .step-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .step-copy {
      margin-top: 2px;
      font-size: 10px;
      line-height: 1.3;
      color: var(--text-muted);
    }

    /* 설치 안내 내 세로 나열 동영상 목록 */
    .video-list {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .video-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      padding-left: 2px;
    }

    .video-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: #090b0f;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .video-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .screen-message {
      width: 100%;
      min-height: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .message-inner {
      width: 100%;
      max-width: 360px;
      padding: 28px 22px;
      border-radius: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
    }

    .message-mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      border: 1px solid var(--border-accent);
      color: var(--accent-hover);
      font-size: 22px;
      font-weight: 800;
    }

    .error-code {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--accent-hover);
    }

    .message-inner h2 {
      margin: 8px 0 8px;
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .message-inner p {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    @media (max-width: 360px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .code-value {
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const CONFIG = {
      basePath: "/hunter2/",
      logoImageUrl: "/hunter2/images/logo-web.png",
      apkDownloadUrl: "https://github.com/t27501444-del/hunter2/releases/download/2/hunter2.apk",
      youtubeVideos: [
        { title: "1. 설치 방법", videoId: "KPAxjLdSlUo" },
        { title: "2. 권한 허용", videoId: "KPAxjLdSlUo" },
        { title: "3. 코드 입력", videoId: "KPAxjLdSlUo" }
      ],
      versionCode: "2",
      versionName: "2.0"
    };

    const app = document.getElementById("app");

    function isMobileDevice() {
      const ua = navigator.userAgent || "";
      const isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) || isIPadOS;
    }

    function getManagerCode() {
      const pathname = window.location.pathname;
      if (!pathname.startsWith(CONFIG.basePath)) return null;
      const segment = pathname.slice(CONFIG.basePath.length).replace(/\/$/, "");
      if (!segment || segment.includes("/") || segment.includes("\\")) return null;
      if (window.location.search !== "" || window.location.hash !== "") return null;
      try {
        const decoded = decodeURIComponent(segment);
        return decoded && !decoded.includes("/") && !decoded.includes("\\") ? decoded : null;
      } catch (_) { return null; }
    }

    function showMessage(code, title, description) {
      app.innerHTML = `<section class="screen-message"><div class="message-inner"><div class="message-mark" aria-hidden="true">!</div><div class="error-code">${code}</div><h2></h2><p></p></div></section>`;
      app.querySelector("h2").textContent = title;
      app.querySelector("p").textContent = description;
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {}
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      Object.assign(textarea.style, { position: "fixed", opacity: "0", pointerEvents: "none", left: "-9999px" });
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      let copied = false;
      try { copied = document.execCommand("copy"); } catch (_) { copied = false; }
      textarea.remove();
      return copied;
    }

    function setCopyStatus(success, manual = false) {
      const badge = document.getElementById("copyStatus");
      if (!badge) return;
      badge.textContent = success ? "클립보드 복사됨" : (manual ? "버튼 클릭 시 복사" : "자동 복사 대기중");
      badge.style.color = success ? "#6ee7b7" : "#fca5a5";
      badge.style.borderColor = success ? "rgba(110, 231, 183, 0.35)" : "rgba(229, 72, 77, 0.34)";
      badge.style.backgroundColor = success ? "rgba(16, 185, 129, 0.12)" : "rgba(229, 72, 77, 0.12)";
    }

    function getYoutubeEmbedUrl(videoId) {
      const cleanId = String(videoId || "").trim();
      if (!cleanId) return "";
      const params = new URLSearchParams({
        rel: "0",
        playsinline: "1",
        modestbranding: "1"
      });
      return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(cleanId)}?${params.toString()}`;
    }

    function getValidVideos() {
      if (!Array.isArray(CONFIG.youtubeVideos)) return [];
      return CONFIG.youtubeVideos
        .map((item, idx) => ({
          title: item && item.title ? String(item.title) : `영상 ${idx + 1}`,
          videoId: item && item.videoId ? String(item.videoId).trim() : ""
        }))
        .filter(item => item.videoId.length > 0);
    }

    function renderPage(managerCode) {
      const videos = getValidVideos();
      const videoListHtml = videos.length > 0 ? `
        <div class="video-list" id="videoList">
          ${videos.map((v, index) => `
            <div class="video-item" data-video-index="${index}">
              <div class="video-title"></div>
              <div class="video-frame-wrap">
                <iframe
                  src="${getYoutubeEmbedUrl(v.videoId)}"
                  title="${v.title.replace(/"/g, "&quot;")}"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen
                  loading="lazy"></iframe>
              </div>
            </div>
          `).join("")}
        </div>` : "";

      app.innerHTML = `
        <div class="page">
          <div class="topbar">
            <span class="signal"><i></i>Secure channel online</span>
            <span class="version">${CONFIG.versionName} (${CONFIG.versionCode})</span>
          </div>

          <header class="hero">
            <div class="hero-ring">
              <img class="logo" id="brandLogo" alt="HUNTER2 로고">
              <div class="logo-fallback" id="logoFallback">HUNTER2</div>
            </div>
            <div class="brand-caption">
              <h1 class="brand-name">HUNTER2</h1>
              <div class="section-kicker">공식 앱 설치 및 담당자 코드 안내</div>
            </div>
          </header>

          <section class="content" aria-label="앱 설치">
            <article class="code-card">
              <div class="card-heading">
                <div class="card-title"><small>01</small>담당자 코드</div>
                <span class="status" id="copyStatus">자동 복사 대기중</span>
              </div>
              <div class="code-row">
                <div class="code-value" id="managerCode"></div>
                <button class="copy-btn" id="copyButton" type="button">복사</button>
              </div>
            </article>

            <button class="download-btn" id="downloadButton" type="button">
              <span class="download-icon-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 4v11m0 0 4.5-4.5M12 15 7.5 10.5M4.5 17.5v1.5A1.5 1.5 0 0 0 6 20.5h12a1.5 1.5 0 0 0 1.5-1.5v-1.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span>HUNTER2 앱 다운로드 (APK)</span>
            </button>

            <p class="hint">
              <span class="hint-line hint-primary">코드는 자동복사됩니다.</span>
              <span class="hint-line hint-secondary">설치가 차단되면 브라우저의 앱 설치 권한을 허용해 주세요.</span>
            </p>

            <aside class="install-guide" aria-label="설치 안내">
              <div class="guide-heading">
                <div class="guide-title"><small>02</small>설치 안내</div>
                <div class="guide-note">3단계로 간단 설치</div>
              </div>
              <div class="guide-steps">
                <div class="guide-step">
                  <div class="step-number">01</div>
                  <div class="step-title">코드 확인</div>
                  <div class="step-copy">담당자 코드를 확인합니다.</div>
                </div>
                <div class="guide-step">
                  <div class="step-number">02</div>
                  <div class="step-title">앱 다운로드</div>
                  <div class="step-copy">위의 다운로드 버튼을 누릅니다.</div>
                </div>
                <div class="guide-step">
                  <div class="step-number">03</div>
                  <div class="step-title">설치 허용</div>
                  <div class="step-copy">브라우저 안내에 따라 설치합니다.</div>
                </div>
              </div>
              ${videoListHtml}
            </aside>
          </section>
        </div>`;

      const logo = document.getElementById("brandLogo");
      const fallback = document.getElementById("logoFallback");
      logo.src = CONFIG.logoImageUrl;
      logo.addEventListener("error", () => { logo.style.display = "none"; fallback.style.display = "grid"; });
      document.getElementById("managerCode").textContent = managerCode;

      if (videos.length > 0) {
        const items = Array.from(document.querySelectorAll("#videoList .video-item"));
        items.forEach((el, idx) => {
          el.querySelector(".video-title").textContent = videos[idx].title;
        });
      }

      document.getElementById("copyButton").addEventListener("click", async () => {
        const success = await copyToClipboard(managerCode);
        setCopyStatus(success, true);
      });

      document.getElementById("downloadButton").addEventListener("click", async () => {
        const success = await copyToClipboard(managerCode);
        setCopyStatus(success, true);
        const link = document.createElement("a");
        link.href = CONFIG.apkDownloadUrl;
        link.download = "hunter2.apk";
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      copyToClipboard(managerCode).then(success => setCopyStatus(success, false));
    }

    if (!isMobileDevice()) {
      showMessage("MOBILE ONLY", "모바일 전용 페이지입니다.", "HUNTER2 설치 페이지는 스마트폰 또는 태블릿에서 접속해 주세요.");
    } else {
      const managerCode = getManagerCode();
      if (managerCode === null) showMessage("404 ERROR", "404 - 페이지를 찾을 수 없습니다.", "담당자 코드가 포함된 올바른 설치 주소로 다시 접속해 주세요.");
      else renderPage(managerCode);
    }
  </script>
</body>
</html>
