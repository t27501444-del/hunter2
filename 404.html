<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080609">
  <meta name="description" content="HUNTER2 모바일 앱 설치 및 담당자 코드">
  <title>HUNTER2 | 설치</title>
  <style>
    :root {
      color-scheme: dark;
      --red: #ff263d;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: #fff;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(130, 0, 25, .32), transparent 48%),
        radial-gradient(ellipse at 50% 100%, rgba(70, 0, 15, .25), transparent 48%),
        #080609;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }
    #app { width: 100%; height: 100%; }
    .page {
      position: relative; isolation: isolate;
      width: min(100%, 480px); height: 100%; height: 100svh;
      margin: 0 auto;
      padding: calc(var(--safe-top) + clamp(12px, 3.2svh, 28px)) 23px calc(var(--safe-bottom) + 14px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: clamp(12px, 2.2svh, 20px);
    }
    .hero {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .logo {
      display: block;
      width: min(80vw, 320px);
      height: auto;
      object-fit: contain;
      border-radius: 0;
      border: none;
      background: transparent;
    }
    .brand-title {
      position: relative; z-index: 2; margin-top: clamp(-27px, -3.5svh, -18px);
      font-size: clamp(39px, 11.5vw, 54px); line-height: .98;
      font-weight: 1000; letter-spacing: .105em; padding-left: .105em;
      color: #fff; -webkit-text-stroke: 1px rgba(255,220,224,.65);
      text-shadow:
        0 2px 0 #7e0719, 0 4px 0 #45040e,
        0 0 9px rgba(255,40,62,.95), 0 0 25px rgba(255,20,45,.8),
        0 7px 18px rgba(0,0,0,.95);
    }
    .subtitle {
      margin: 8px 0 0; color: #ff5265; font-size: 12px; font-weight: 900;
      letter-spacing: .65em; padding-left: .65em;
      text-shadow: 0 0 12px rgba(255,37,60,.65);
    }
    .content { width: 100%; display: grid; gap: 12px; flex: 0 0 auto; }
    .code-card {
      position: relative; padding: 15px 15px 13px; overflow: hidden;
      border-radius: 15px; border: 1px solid rgba(255,75,94,.3);
      background: linear-gradient(145deg, rgba(35,13,19,.95), rgba(13,9,12,.97));
      box-shadow: 0 12px 30px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.04);
    }
    .code-card::before {
      content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,83,101,.7), transparent);
    }
    .card-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-title { font-size: 13px; font-weight: 900; letter-spacing: .04em; }
    .card-title small { color: #ff6574; font-size: 10px; margin-right: 7px; letter-spacing: .12em; }
    .status {
      flex: 0 0 auto; border: 1px solid rgba(255,87,104,.34); border-radius: 99px;
      padding: 5px 8px; color: #ff9aa4; background: rgba(255,37,60,.09);
      font-size: 10px; font-weight: 750;
    }
    .code-row {
      display: flex; align-items: center; gap: 9px; margin-top: 11px;
      padding: 10px 10px 10px 13px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.09); background: rgba(0,0,0,.38);
    }
    .code-value {
      min-width: 0; flex: 1; overflow-wrap: anywhere; color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 18px; font-weight: 850; letter-spacing: .08em;
    }
    button { -webkit-tap-highlight-color: transparent; }
    button:active { transform: scale(.97); filter: brightness(1.18); }
    .copy-btn {
      flex: 0 0 auto; border: 1px solid rgba(255,87,104,.5); border-radius: 8px;
      padding: 9px 13px; color: #fff; background: linear-gradient(135deg,#9f1428,#e52a40);
      font: inherit; font-size: 12px; font-weight: 850; cursor: pointer;
      box-shadow: 0 4px 14px rgba(213,25,51,.22); transition: transform .15s, filter .15s;
    }
    .download-btn {
      width: 100%; min-height: 57px; display: flex; align-items: center; justify-content: center; gap: 11px;
      border: 1px solid rgba(255,160,167,.58); border-radius: 13px; color: white;
      background: linear-gradient(105deg,#8e1024 0%,#f12a42 52%,#a80e29 100%);
      box-shadow: 0 8px 25px rgba(231,25,54,.3), inset 0 1px rgba(255,255,255,.24);
      font: inherit; font-size: 17px; font-weight: 950; letter-spacing: .12em;
      cursor: pointer; transition: transform .16s, filter .16s, box-shadow .16s;
    }
    .download-btn:active { transform: translateY(2px) scale(.99); filter: brightness(1.2); box-shadow: 0 3px 12px rgba(231,25,54,.3); }
    .download-btn svg { width: 21px; height: 21px; }
    .hint { margin: 0; color: #a9959b; font-size: 10px; line-height: 1.5; text-align: center; }
    .toast {
      position: fixed; z-index: 10; left: 50%; bottom: calc(18px + var(--safe-bottom));
      transform: translate(-50%,16px); opacity: 0; pointer-events: none;
      width: max-content; max-width: calc(100% - 36px); padding: 11px 16px;
      border: 1px solid rgba(255,93,109,.4); border-radius: 99px;
      background: rgba(25,9,14,.97); color: #fff; font-size: 12px; font-weight: 750;
      box-shadow: 0 8px 30px rgba(0,0,0,.5); transition: opacity .22s, transform .22s; text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .screen-message {
      width: 100%; height: 100%; min-height: 100svh; display: grid; place-items: center;
      padding: 30px; text-align: center;
    }
    .message-inner { max-width: 360px; }
    .error-code { color: #ff4055; font-size: 12px; font-weight: 900; letter-spacing: .28em; }
    .message-inner h2 { margin: 14px 0 10px; font-size: 24px; }
    .message-inner p { margin: 0; color: #b9a9ae; font-size: 13px; line-height: 1.7; }
    .message-mark {
      width: 62px; height: 62px; margin: 0 auto 20px; display: grid; place-items: center;
      border: 1px solid rgba(255,60,80,.5); border-radius: 50%; color: #ff5367; font-size: 28px;
      box-shadow: 0 0 28px rgba(255,40,60,.2);
    }
    @media (max-height: 650px) {
      .page { gap: 9px; padding-top: calc(var(--safe-top) + 8px); padding-bottom: calc(var(--safe-bottom) + 8px); }
      .hero { padding-bottom: 16px; }
      .brand-title { font-size: clamp(35px, 10vw, 45px); margin-top: -19px; }
      .subtitle { margin-top: 5px; }
      .content { gap: 8px; }
      .code-card { padding: 11px 13px; }
      .code-row { margin-top: 8px; padding-top: 8px; padding-bottom: 8px; }
      .download-btn { min-height: 51px; }
    }
    @media (max-width: 360px) {
      .page { padding-left: 17px; padding-right: 17px; }
      .code-value { font-size: 15px; }
      .status { font-size: 9px; padding: 5px 7px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    // ==========================================
    // 설정 영역 (실제 경로에 맞게 수정하세요)
    // ==========================================
    const CONFIG = {
      basePath: "/hunter2/",
      logoImageUrl: "/hunter2/images/logo-web.png",
      apkDownloadUrl: "https://github.com/t27501444-del/hunter2/releases/download/2/hunter2.apk"
    };

    const app = document.getElementById("app");
    const toastElement = document.getElementById("toast");
    let toastTimer = null;

    function isMobileDevice() {
      const ua = navigator.userAgent || "";
      const isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) || isIPadOS;
    }

    function getManagerCode() {
      const pathname = window.location.pathname;
      if (!pathname.startsWith(CONFIG.basePath)) return null;

      let segment = pathname.slice(CONFIG.basePath.length).replace(/\/$/, "");
      if (!segment || segment.includes("/") || segment.includes("\\")) return null;
      if (window.location.search !== "" || window.location.hash !== "") return null;

      let decoded;
      try { decoded = decodeURIComponent(segment); }
      catch (_) { return null; }

      if (!decoded || decoded.length < 1 || decoded.includes("/") || decoded.includes("\\")) return null;
      return decoded;
    }

    function showMessage(code, title, description) {
      app.innerHTML = `
        <section class="screen-message">
          <div class="message-inner">
            <div class="message-mark" aria-hidden="true">!</div>
            <div class="error-code">${code}</div>
            <h2></h2><p></p>
          </div>
        </section>`;
      app.querySelector("h2").textContent = title;
      app.querySelector("p").textContent = description;
    }

    function showToast(message) {
      toastElement.textContent = message;
      toastElement.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastElement.classList.remove("show"), 2300);
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {}

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      textarea.style.pointerEvents = "none";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      let copied = false;
      try { copied = document.execCommand("copy"); }
      catch (_) { copied = false; }
      textarea.remove();
      return copied;
    }

    function setCopyStatus(success, manual = false) {
      const badge = document.getElementById("copyStatus");
      if (!badge) return;
      badge.textContent = success ? "클립보드 복사됨" : (manual ? "버튼 클릭 시 복사" : "자동 복사 대기중");
      badge.style.color = success ? "#a5f0c3" : "#ff9aa4";
      badge.style.borderColor = success ? "rgba(100,220,155,.35)" : "rgba(255,87,104,.34)";
    }

    function renderPage(managerCode) {
      app.innerHTML = `
        <div class="page">
          <header class="hero">
            <div><img class="logo" id="brandLogo" alt="HUNTER2 로고"></div>
          </header>

          <section class="content" aria-label="앱 설치">
            <article class="code-card">
              <div class="card-heading">
                <div class="card-title"><small>01</small>담당자 코드</div>
                <span class="status" id="copyStatus">자동 복사 대기중</span>
              </div>
              <div class="code-row">
                <div class="code-value" id="managerCode"></div>
                <button class="copy-btn" id="copyButton" type="button">복사</button>
              </div>
            </article>

            <button class="download-btn" id="downloadButton" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3.5v11m0 0 4.5-4.5M12 14.5 7.5 10M4 17.5v2A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              다운로드
            </button>
            <p class="hint">다운로드 시 담당자 코드가 자동 복사됩니다. 설치가 차단되면 브라우저의 앱 설치를 허용해 주세요.</p>
          </section>
        </div>`;

      const logo = document.getElementById("brandLogo");
      logo.src = CONFIG.logoImageUrl;

      // 담당자 코드는 HTML이 아닌 textContent로 출력해 XSS를 방지합니다.
      document.getElementById("managerCode").textContent = managerCode;

      document.getElementById("copyButton").addEventListener("click", async () => {
        const success = await copyToClipboard(managerCode);
        setCopyStatus(success, true);
        showToast(success ? "담당자 코드가 복사되었습니다." : "복사에 실패했습니다. 코드를 길게 눌러 복사해 주세요.");
      });

      document.getElementById("downloadButton").addEventListener("click", async () => {
        const success = await copyToClipboard(managerCode);
        setCopyStatus(success, true);
        showToast(success ? "담당자 코드 복사 완료 · 다운로드를 시작합니다." : "코드 복사 실패 · 다운로드를 시작합니다.");

        const link = document.createElement("a");
        link.href = CONFIG.apkDownloadUrl;
        link.download = "hunter2.apk";
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      // 진입 즉시 자동 복사를 시도합니다. 브라우저 정책상 사용자 동작이 필요할 수 있습니다.
      copyToClipboard(managerCode).then(success => setCopyStatus(success, false));
    }

    if (!isMobileDevice()) {
      showMessage("MOBILE ONLY", "모바일 전용 페이지입니다.", "HUNTER2 설치 페이지는 스마트폰 또는 태블릿에서 접속해 주세요.");
    } else {
      const managerCode = getManagerCode();
      if (managerCode === null) {
        showMessage("404 ERROR", "404 - 페이지를 찾을 수 없습니다.", "담당자 코드가 포함된 올바른 설치 주소로 다시 접속해 주세요.");
      } else {
        renderPage(managerCode);
      }
    }
  </script>
</body>
</html>
