<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090608">
  <meta name="description" content="HUNTER2 모바일 앱 설치 및 담당자 코드 안내">
  <title>HUNTER2 | 설치</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080608;
      --panel: rgba(20, 9, 13, .88);
      --red: #ff263d;
      --red-bright: #ff5263;
      --muted: #b8a9ad;
      --line: rgba(255, 75, 94, .25);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 22%, rgba(126, 0, 20, .32), transparent 42%),
        radial-gradient(ellipse at 50% 100%, rgba(74, 0, 15, .25), transparent 45%),
        #080608;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; opacity: .22;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }
    .page {
      width: min(100%, 480px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(34px, env(safe-area-inset-top)) 24px calc(28px + var(--safe-bottom));
      display: flex; flex-direction: column; align-items: center;
      position: relative;
    }
    .hero { width: 100%; text-align: center; padding-top: 8px; }
    .logo-ring {
      width: 190px; height: 190px; margin: 0 auto 24px; padding: 5px;
      border-radius: 50%; position: relative;
      background: linear-gradient(145deg, #fff0f1 0%, #ff344b 26%, #5e0717 65%, #ff6b45 100%);
      box-shadow: 0 0 14px rgba(255, 39, 60, .75), 0 0 42px rgba(255, 23, 48, .38), inset 0 0 12px #ffb1b9;
    }
    .logo-ring::before {
      content: ""; position: absolute; inset: -9px; border-radius: 50%;
      border: 1px solid rgba(255, 67, 82, .42);
      box-shadow: 0 0 22px rgba(255, 33, 54, .35);
    }
    .logo {
      display: block; width: 100%; height: 100%; border-radius: 50%;
      object-fit: cover; background: #10070a;
      border: 2px solid rgba(255,255,255,.16);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      color: #ff7784; font-size: 10px; font-weight: 800; letter-spacing: .34em;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .eyebrow::before, .eyebrow::after { content: ""; width: 22px; height: 1px; background: #a91b2d; }
    h1 {
      margin: 0; font-size: clamp(38px, 11vw, 50px); line-height: 1;
      font-weight: 950; letter-spacing: .12em; padding-left: .12em;
      text-shadow: 0 0 12px rgba(255, 42, 64, .55), 0 3px 22px rgba(0,0,0,.9);
    }
    .subtitle {
      margin: 12px 0 0; color: #ff4559; font-size: 14px; font-weight: 800;
      letter-spacing: .65em; padding-left: .65em;
    }
    .rule {
      width: 74px; height: 2px; margin: 25px auto 25px;
      background: linear-gradient(90deg, transparent, #ff3048, transparent);
      box-shadow: 0 0 12px #ff263d;
    }
    .content { width: 100%; display: grid; gap: 15px; }
    .card {
      position: relative; overflow: hidden; border-radius: 17px;
      background: linear-gradient(145deg, rgba(35, 13, 19, .94), rgba(13, 9, 12, .96));
      border: 1px solid var(--line);
      box-shadow: 0 14px 35px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.035);
    }
    .code-card { padding: 19px 18px 17px; }
    .card::after {
      content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,83,101,.65), transparent);
    }
    .card-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-title { font-size: 13px; font-weight: 850; letter-spacing: .04em; }
    .card-title small { color: #ff6574; font-size: 10px; margin-right: 7px; letter-spacing: .12em; }
    .status {
      flex: 0 0 auto; border: 1px solid rgba(255, 87, 104, .34);
      border-radius: 99px; padding: 6px 9px; color: #ff9aa4;
      background: rgba(255, 37, 60, .09); font-size: 10px; font-weight: 750;
    }
    .code-row {
      display: flex; align-items: center; gap: 9px; margin-top: 15px;
      padding: 12px 11px 12px 14px; border-radius: 11px;
      border: 1px solid rgba(255,255,255,.09); background: rgba(0,0,0,.36);
    }
    .code-value {
      min-width: 0; flex: 1; overflow-wrap: anywhere; color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 18px; font-weight: 850; letter-spacing: .08em;
    }
    .copy-btn {
      flex: 0 0 auto; border: 1px solid rgba(255,87,104,.5); border-radius: 8px;
      padding: 9px 13px; color: #fff; background: linear-gradient(135deg, #9f1428, #e52a40);
      font: inherit; font-size: 12px; font-weight: 850; cursor: pointer;
      box-shadow: 0 4px 14px rgba(213, 25, 51, .22);
      transition: transform .15s, filter .15s;
    }
    button:active { transform: scale(.97); filter: brightness(1.18); }
    .code-help { margin: 11px 1px 0; color: #a9969b; font-size: 11px; line-height: 1.55; }
    .download-btn {
      width: 100%; min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 11px;
      border: 1px solid rgba(255,160,167,.55); border-radius: 13px;
      color: white; background: linear-gradient(105deg, #8e1024 0%, #f12a42 52%, #a80e29 100%);
      box-shadow: 0 8px 25px rgba(231, 25, 54, .28), inset 0 1px rgba(255,255,255,.24);
      font: inherit; font-size: 17px; font-weight: 900; letter-spacing: .08em;
      cursor: pointer; transition: transform .16s, filter .16s, box-shadow .16s;
    }
    .download-btn:active { transform: translateY(2px) scale(.99); filter: brightness(1.2); box-shadow: 0 3px 12px rgba(231,25,54,.3); }
    .download-btn svg { width: 21px; height: 21px; }
    .guide { padding: 17px 18px 16px; }
    .guide-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 850; margin-bottom: 12px; }
    .guide-title svg { color: #ff5367; width: 17px; height: 17px; }
    .steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .steps li { display: grid; grid-template-columns: 22px 1fr; gap: 9px; color: #c8b9bd; font-size: 11px; line-height: 1.65; }
    .num {
      width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%;
      color: #ff9aa4; background: rgba(255,44,66,.13); border: 1px solid rgba(255,74,91,.32);
      font-size: 10px; font-weight: 900;
    }
    .steps strong { color: #fff; font-weight: 800; }
    .foot { margin-top: auto; padding-top: 25px; color: #66545a; font-size: 9px; letter-spacing: .22em; text-align: center; }
    .toast {
      position: fixed; z-index: 10; left: 50%; bottom: calc(22px + var(--safe-bottom));
      transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
      width: max-content; max-width: calc(100% - 36px); padding: 12px 17px;
      border: 1px solid rgba(255,93,109,.4); border-radius: 99px;
      background: rgba(25, 9, 14, .96); color: #fff; font-size: 12px; font-weight: 750;
      box-shadow: 0 8px 30px rgba(0,0,0,.5); transition: opacity .22s, transform .22s;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .screen-message {
      width: 100%; min-height: 100svh; display: grid; place-items: center;
      padding: 30px; text-align: center;
    }
    .message-inner { max-width: 360px; }
    .error-code { color: #ff4055; font-size: 12px; font-weight: 900; letter-spacing: .28em; }
    .message-inner h2 { margin: 14px 0 10px; font-size: 24px; }
    .message-inner p { margin: 0; color: #b9a9ae; font-size: 13px; line-height: 1.7; }
    .message-mark { width: 62px; height: 62px; margin: 0 auto 20px; display: grid; place-items: center; border: 1px solid rgba(255,60,80,.5); border-radius: 50%; color: #ff5367; font-size: 28px; box-shadow: 0 0 28px rgba(255,40,60,.2); }
    @media (max-width: 360px) {
      .page { padding-left: 18px; padding-right: 18px; }
      .logo-ring { width: 164px; height: 164px; }
      .code-value { font-size: 15px; }
      .status { font-size: 9px; padding: 5px 7px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // ==========================================
    // 설정 영역 (실제 경로에 맞게 수정하세요)
    // ==========================================
    const CONFIG = {
      basePath: "/hunter2/",
      logoImageUrl: "/hunter2/images/logo.png",
      apkDownloadUrl: "https://github.com/t27501444-del/hunter2/releases/download/2/hunter2.apk"
    };

    const app = document.getElementById("app");
    const toastElement = document.getElementById("toast");
    let toastTimer = null;

    function isMobileDevice() {
      const ua = navigator.userAgent || "";
      const isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) || isIPadOS;
    }

    function getManagerCode() {
      const pathname = window.location.pathname;
      if (!pathname.startsWith(CONFIG.basePath)) return null;

      let segment = pathname.slice(CONFIG.basePath.length);
      segment = segment.replace(/\/$/, "");
      if (!segment || segment.includes("/") || segment.includes("\\")) return null;
      if (window.location.search !== "" || window.location.hash !== "") return null;

      let decoded;
      try {
        decoded = decodeURIComponent(segment);
      } catch (_) {
        return null;
      }
      // 인코딩된 구분자까지 차단해 단일 경로 세그먼트만 허용합니다.
      if (!decoded || decoded.length < 1 || decoded.includes("/") || decoded.includes("\\")) return null;
      return decoded;
    }

    function showMessage(code, title, description) {
      app.innerHTML = `
        <section class="screen-message">
          <div class="message-inner">
            <div class="message-mark" aria-hidden="true">!</div>
            <div class="error-code">${code}</div>
            <h2></h2>
            <p></p>
          </div>
        </section>`;
      app.querySelector("h2").textContent = title;
      app.querySelector("p").textContent = description;
    }

    function showToast(message) {
      toastElement.textContent = message;
      toastElement.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastElement.classList.remove("show"), 2300);
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {
        // 권한 거부 또는 비보안 컨텍스트에서는 아래 폴백을 시도합니다.
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      textarea.style.pointerEvents = "none";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch (_) {
        copied = false;
      }
      textarea.remove();
      return copied;
    }

    function setCopyStatus(success, manual = false) {
      const badge = document.getElementById("copyStatus");
      if (!badge) return;
      badge.textContent = success
        ? "클립보드 복사됨"
        : (manual ? "버튼 클릭 시 복사" : "자동 복사 대기중");
      badge.style.color = success ? "#a5f0c3" : "#ff9aa4";
      badge.style.borderColor = success ? "rgba(100,220,155,.35)" : "rgba(255,87,104,.34)";
    }

    function renderPage(managerCode) {
      app.innerHTML = `
        <div class="page">
          <header class="hero">
            <div class="logo-ring">
              <img class="logo" id="brandLogo" alt="HUNTER2 로고">
            </div>
            <div class="eyebrow">HUNTER ACCESS SYSTEM</div>
            <h1>HUNTER2</h1>
            <p class="subtitle">설 치</p>
            <div class="rule"></div>
          </header>

          <section class="content" aria-label="앱 설치">
            <article class="card code-card">
              <div class="card-heading">
                <div class="card-title"><small>01</small>담당자 코드</div>
                <span class="status" id="copyStatus">자동 복사 대기중</span>
              </div>
              <div class="code-row">
                <div class="code-value" id="managerCode"></div>
                <button class="copy-btn" id="copyButton" type="button">복사</button>
              </div>
              <p class="code-help">앱 설치 및 최초 실행 시 사용할 담당자 코드입니다.</p>
            </article>

            <button class="download-btn" id="downloadButton" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3.5v11m0 0 4.5-4.5M12 14.5 7.5 10M4 17.5v2A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              다운로드
            </button>

            <article class="card guide">
              <div class="guide-title">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 3 21 7.5v9L12 21l-9-4.5v-9L12 3Z" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M12 8v5m0 3h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                설치 안내
              </div>
              <ol class="steps">
                <li><span class="num">1</span><span><strong>다운로드 버튼</strong>을 누르면 담당자 코드 복사를 다시 시도한 후 APK 파일을 다운로드합니다.</span></li>
                <li><span class="num">2</span><span>다운로드가 완료되면 파일을 열어 <strong>HUNTER2 앱 설치</strong>를 진행하세요.</span></li>
                <li><span class="num">3</span><span>설치가 차단되면 설정에서 <strong>‘출처를 알 수 없는 앱 설치’</strong> 또는 해당 브라우저의 앱 설치 허용을 켜주세요.</span></li>
                <li><span class="num">4</span><span>앱을 실행하고 복사된 <strong>담당자 코드</strong>를 입력하세요.</span></li>
              </ol>
            </article>
          </section>
          <footer class="foot">HUNTER2 · SECURE INSTALLATION</footer>
        </div>`;

      const logo = document.getElementById("brandLogo");
      logo.src = CONFIG.logoImageUrl;
      logo.addEventListener("error", () => {
        const ring = logo.closest(".logo-ring");
        if (ring) ring.remove();
      }, { once: true });

      // 코드 문자열은 HTML로 삽입하지 않고 textContent로만 출력합니다.
      document.getElementById("managerCode").textContent = managerCode;

      document.getElementById("copyButton").addEventListener("click", async () => {
        const success = await copyToClipboard(managerCode);
        setCopyStatus(success, true);
        showToast(success ? "담당자 코드가 복사되었습니다." : "복사할 수 없습니다. 코드를 길게 눌러 복사해 주세요.");
      });

      document.getElementById("downloadButton").addEventListener("click", async () => {
        const success = await copyToClipboard(managerCode);
        setCopyStatus(success, true);
        showToast(success ? "담당자 코드 복사 완료 · 다운로드를 시작합니다." : "코드 복사에 실패했습니다. 다운로드를 시작합니다.");

        const link = document.createElement("a");
        link.href = CONFIG.apkDownloadUrl;
        link.download = "hunter2.apk";
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      // 페이지 진입 시 자동 복사: 브라우저 정책에 따라 사용자 동작이 필요할 수 있습니다.
      copyToClipboard(managerCode).then(success => setCopyStatus(success, false));
    }

    if (!isMobileDevice()) {
      showMessage("MOBILE ONLY", "모바일 전용 페이지입니다.", "HUNTER2 설치 페이지는 스마트폰 또는 태블릿에서 접속해 주세요.");
    } else {
      const managerCode = getManagerCode();
      if (managerCode === null) {
        showMessage("404 ERROR", "404 - 페이지를 찾을 수 없습니다.", "담당자 코드가 포함된 올바른 설치 주소로 다시 접속해 주세요.");
      } else {
        renderPage(managerCode);
      }
    }
  </script>
</body>
</html>
