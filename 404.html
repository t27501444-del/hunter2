<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <meta name="description" content="HUNTER2 모바일 앱 설치 및 담당자 코드">
  <title>HUNTER2 | INSTALLATION NODE</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-base: #0d0f14;
      --bg-elevated: #151821;
      --bg-surface: rgba(24, 28, 38, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(229, 72, 77, 0.34);
      --accent: #e5484d;
      --accent-hover: #f2555a;
      --accent-soft: rgba(229, 72, 77, 0.12);
      --text-primary: #f3f4f6;
      --text-secondary: #a8b0bf;
      --text-muted: #768092;
      --success-text: #6ee7b7;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow-x: hidden;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      overflow-y: auto;
      background-image:
        radial-gradient(circle at 50% 6%, rgba(229, 72, 77, 0.11), transparent 44%),
        radial-gradient(circle at 15% 88%, rgba(59, 130, 246, 0.04), transparent 36%),
        linear-gradient(180deg, #0d0f14 0%, #0a0c10 100%);
    }

    #app {
      width: 100%;
      min-height: 100%;
      min-height: 100svh;
    }

    .page {
      width: min(100%, 460px);
      min-height: 100%;
      min-height: 100svh;
      margin: 0 auto;
      padding: 14px 18px calc(var(--safe-bottom) + 18px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .topbar .signal {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-primary);
    }

    .signal i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success-text);
      box-shadow: 0 0 8px rgba(110, 231, 183, 0.5);
    }

    .topbar .version {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px 0;
      flex-shrink: 0;
    }

    .hero-ring {
      position: relative;
      width: clamp(112px, 22svh, 156px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(145deg, rgba(229, 72, 77, 0.45), rgba(255, 255, 255, 0.06));
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45), 0 0 28px rgba(229, 72, 77, 0.12);
    }

    .logo {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #090a0d;
    }

    .logo-fallback {
      display: none;
      place-items: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #141720;
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .brand-caption {
      margin-top: 6px;
      text-align: center;
    }

    .brand-name {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--text-primary);
    }

    .section-kicker {
      margin-top: 2px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
    }

    .code-card {
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .card-title small {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-size: 10px;
      font-weight: 800;
    }

    .status {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-accent);
      background: var(--accent-soft);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 8px 8px 8px 12px;
      border-radius: 12px;
      background: rgba(10, 12, 16, 0.72);
      border: 1px solid var(--border-subtle);
    }

    .code-value {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-primary);
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    .copy-btn {
      flex-shrink: 0;
      padding: 8px 13px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #232836;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.14s ease;
    }

    .copy-btn:hover {
      background: #2c3244;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .download-btn {
      width: 100%;
      min-height: 50px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 130, 134, 0.35);
      background: linear-gradient(180deg, var(--accent-hover) 0%, var(--accent) 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(229, 72, 77, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: transform 0.15s ease, filter 0.18s ease, box-shadow 0.18s ease;
    }

    .download-btn:hover {
      filter: brightness(1.05);
    }

    .download-icon-badge {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
    }

    .download-btn svg {
      width: 15px;
      height: 15px;
    }

    .hint {
      margin: 0;
      padding: 0
